{% extends "base.html" %}
{% block title %}Scopes · kEngram{% endblock %}
{% block page %}scopes{% endblock %}
{% block content %}
<h1>Scopes</h1>
{% if roots.is_empty() %}
<p class="muted">No scopes yet.</p>
{% else %}
<div class="scope-tree">
  {%- for r in roots %}
  {{ r.render()?|safe }}
  {%- endfor %}
</div>
{% endif %}
{% endblock %}
